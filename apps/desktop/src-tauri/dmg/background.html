<!-- Disk image window background. Render with render.sh; Finder draws the two icons and their labels on top (positions in tauri.conf.json, bundle.macOS.dmg). -->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Onest;src:url(../../src/assets/fonts/onest-latin-wght-normal.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:JBM;src:url(../../src/assets/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:660px;height:460px;overflow:hidden}
body{background:#0b0b0c;color:#f3efe6;font-family:Onest;-webkit-font-smoothing:antialiased;position:relative}
.light{position:absolute;inset:0;background:
  radial-gradient(520px 300px at 18% -12%, rgba(255,255,255,.075), transparent 70%),
  radial-gradient(260px 220px at 506px 236px, rgba(214,255,61,.16), transparent 72%),
  radial-gradient(300px 160px at 50% 118%, rgba(214,255,61,.05), transparent 70%)}
.grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay}
.dots{position:absolute;inset:0;opacity:.07}
.vign{position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 40%, transparent 55%, rgba(0,0,0,.55))}
.head{position:absolute;left:30px;top:24px;display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;letter-spacing:-.01em}
.mark{width:22px;height:22px}
.ver{font-family:JBM;font-weight:700;font-size:10.5px;color:#0b0b0c;background:#d6ff3d;border-radius:5px;padding:1px 6px;margin-left:2px}
h1{position:absolute;left:30px;top:56px;font-weight:800;font-size:38px;line-height:1.04;letter-spacing:-.04em}
.hl{position:relative;color:#0b0b0c;padding:0 10px 3px;margin-left:3px;border-radius:11px;
  background:linear-gradient(180deg,#e6ff78,#d2fb36);box-shadow:0 8px 24px -8px rgba(214,255,61,.55), inset 0 1px 0 rgba(255,255,255,.55)}
.tile{position:absolute;top:140px;width:168px;height:196px;border-radius:28px}
.app{left:70px;background:linear-gradient(180deg,#1d1d21,#111113);
  box-shadow:0 24px 48px -16px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 1px rgba(255,255,255,.06)}
.dst{left:422px;background:linear-gradient(180deg,rgba(214,255,61,.10),rgba(214,255,61,.03));
  box-shadow:0 0 0 1px rgba(214,255,61,.0), 0 24px 60px -20px rgba(214,255,61,.35), inset 0 1px 0 rgba(255,255,255,.06)}
.dst svg.dash{position:absolute;inset:0}
.fold{position:absolute;left:204px;top:160px;width:258px;height:160px;filter:drop-shadow(0 14px 18px rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(214,255,61,.18))}
.foot{position:absolute;left:30px;right:30px;top:362px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:#8d8a84;letter-spacing:-.01em}
.ico{width:17px;height:17px;flex:none}
.lead{color:#f3efe6;font-weight:800}
.path{margin-left:4px}
.sep{color:#d6ff3d;margin:0 7px;font-weight:800}
</style></head><body>
