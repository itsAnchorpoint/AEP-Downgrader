[package]
name = "aep-downgrader-desktop"
version = "2.0.0-beta.2"
description = "AEP Downgrader desktop app"
license = "GPL-3.0-only"
edition = "2021"
publish = false

# Not a member of the repository's root workspace.
[workspace]

[lib]
name = "aep_downgrader_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
# The XDG desktop portal gives the system file dialog (KDE, GNOME) instead of a GTK one.
tauri-plugin-dialog = { version = "2.8", default-features = false, features = ["xdg-portal"] }
tauri-plugin-opener = "2.7"
tauri-plugin-store = "2.5"
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aep-core = { path = "../../../crates/aep-core" }

[target.'cfg(windows)'.dependencies]
self-replace = "1.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
