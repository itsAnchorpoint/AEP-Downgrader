[package]
name = "aepd-installer-ui"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Draws the window of the AEP Downgrader installer for Windows (an NSIS plug-in)"

# Not a member of any other workspace.
[workspace]

[lib]
name = "aepd_ui"
crate-type = ["cdylib", "rlib"]

[dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "png-format"] }
rustybuzz = "0.20"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
