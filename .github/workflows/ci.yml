name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (tests, lint, wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Core builds for WebAssembly
        run: cargo check -p aep-core --target wasm32-unknown-unknown

  app:
    name: App (${{ matrix.name }})
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || runner.os == 'Windows' && 'i686-pc-windows-msvc' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/desktop/src-tauri/windows/ui
      - run: pnpm install --frozen-lockfile
      - name: Windows installer template matches the Tauri versions
        run: node scripts/check-installer-template.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - name: Rust tests and lint
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Lint the Windows installer window
        if: runner.os == 'Windows'
        working-directory: apps/desktop/src-tauri/windows/ui
        run: cargo clippy --release --locked --target i686-pc-windows-msvc -- -D warnings
      - name: Build installers
        run: pnpm tauri build ${{ matrix.args }}
        env:
          # Tauri skips the Finder step that lays out the disk image window when CI=true.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: AEP-Downgrader-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
