name: Site

# Builds site/ and publishes it to GitHub Pages (aepdowngrader.com). The download buttons point at the version in
# apps/desktop/package.json, so the site goes out only once that release is published; a push to main before then
# is skipped. A published release runs from its tag, and Pages deploys only from main, so on a release the workflow
# starts itself again on main. Before launch the domain is served from the gh-pages branch (a placeholder).
# A daily run refreshes the download count on the page and the README badge (site/public/badge/downloads.json):
# the count is fetched at build time, so visitors' browsers never call GitHub.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "site/**"
      - "apps/desktop/package.json"
      - "apps/desktop/src/i18n/**"
      - "crates/aep-core/src/compat.rs"
      - "crates/aep-wasm/**"
      - ".github/workflows/site.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Release events run on the tag; hand over to main, where the github-pages environment allows deploys.
  handoff:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
      - name: Is this version released?
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          draft=$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$draft" = "false" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is not published yet ($draft); the site waits for the release."
          fi
      - uses: pnpm/action-setup@v4
        if: steps.release.outputs.ready == 'true'
        with:
          version: 12
      - uses: actions/setup-node@v5
        if: steps.release.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.ready == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.release.outputs.ready == 'true'
      - name: Build
        if: steps.release.outputs.ready == 'true'
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_STRICT: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-pages-artifact@v4
        if: steps.release.outputs.ready == 'true'
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
